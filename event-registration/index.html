<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechFest 2026 - Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>TechFest 2026</h1>
    <p class="sub">Event Registration Form</p>

    <form id="regForm" novalidate>
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="name@example.com" required>

      <label for="phone">Mobile Number</label>
      <input type="tel" id="phone" placeholder="10-digit mobile number" required>

      <label for="college">College</label>
      <input type="text" id="college" placeholder="College name" required>

      <label for="event">Select Event</label>
      <select id="event" required>
        <option value="">-- Choose an event --</option>
        <option>Hackathon</option>
        <option>Paper Presentation</option>
        <option>Coding Contest</option>
        <option>Robotics Workshop</option>
      </select>

      <label>Gender</label>
      <div class="radio">
        <input type="radio" name="gender" value="Male" id="m"><label for="m">Male</label>
        <input type="radio" name="gender" value="Female" id="f"><label for="f">Female</label>
        <input type="radio" name="gender" value="Other" id="o"><label for="o">Other</label>
      </div>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min. 6 characters" required>

      <div class="check">
        <input type="checkbox" id="terms">
        <label for="terms">I agree to the terms and conditions</label>
      </div>

      <p id="error" class="error"></p>
      <button type="submit">Register</button>
      <button type="reset" class="reset">Clear</button>
    </form>

    <div id="success" class="success"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
